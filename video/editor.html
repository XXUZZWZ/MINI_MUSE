function tick(){if(audio.paused){playing=false;playBtn.textContent='▶ 预览';return}draw(audio.currentTime);raf=requestAnimationFrame(tick)}function start(){audio.play();playing=true;playBtn.textContent='❚❚ 暂停';cancelAnimationFrame(raf);tick()}

recordBtn.onclick=async()=>{if(!window.MediaRecorder||!cv.captureStream){status.textContent='请在最新版 Edge 中录制。';return}recordBtn.disabled=true;chunks=[];audio.pause();audio.currentTime=0;draw(0);const stream=cv.captureStream(30),as=audio.captureStream();as.getAudioTracks().forEach(track=>stream.addTrack(track));const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:4500000});recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=async()=>{let blob=new Blob(chunks,{type:mime});try{blob=await ysFixWebmDuration(blob,Date.now()-recordStart,{logger:false})}catch{}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='MinMuse_最小邮件Agent.webm';a.click();status.textContent=`原始视频已保存：${(blob.size/1048576).toFixed(1)} MB WebM。`;recordBtn.disabled=false;playing=false;playBtn.textContent='▶ 预览';draw(0)};recordStart=Date.now();recorder.start(250);status.textContent='正在实时录制，请保持页面开启…';await new Promise(r=>setTimeout(r,300));start();audio.onended=()=>{cancelAnimationFrame(raf);draw(duration);setTimeout(()=>{if(recorder?.state==='recording')recorder.stop()},900)}};
